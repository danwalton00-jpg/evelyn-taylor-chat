[build]
  command = "unzip -o Evelyn-Taylor-Chat-Web-Patched.zip -d . && cd mpf_ios18 && npm install && npm run build:web"
  publish = "mpf_ios18/dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment"
